name: Nightly performance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run ignored performance gates
        run: cargo test --locked --test perf -- --ignored
